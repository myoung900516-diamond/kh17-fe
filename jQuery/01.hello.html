        $(function(){
            //$를 이용해서 class="btn"을 선택한 뒤 click이벤트 설정
            //$("btn").on("click", function(){}); //click, blur, submit, input 을 다 사용할 수 있는 방법

            $(".btn").on("click", function(){


                //$를 이용해서 class="target"을 선택한 뒤 css변경을 지시
                //-css, value, textContent, attribute등 다양한 변경 지시가 가능
                $(".target").css("color", "red");
            });
        });
