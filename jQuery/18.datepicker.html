<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        /* div{ box-shadow: 0 0 0 1px #cccccc;} */
    </style>
<!-- lightpick CDN -->
    <link href="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/css/lightpick.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/lightpick.min.js"></script>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
    // var picker = new Lightpick({ field: document.getElementById('datepicker') });
    $(function(){
        //lightpicker 생성
        // var picker = new Lightpick({ field : document.querySelector(".picker-1") });
        var picker1 = new Lightpick({ field : $(".picker-1")[0] });
        var picker2 = new Lightpick({ 
            field : $(".picker-2")[0], 
            format : "YYYY-MM-DD"
        });
        var picker3 = new Lightpick({ 
            field : $(".picker-3")[0],
            format : "YYYY-MM-DD",
            firstDay : 7,
        });
        var picker4 = new Lightpick({ 
            field : $(".picker-4")[0],
            format : "YYYY-MM-DD",
            firstDay : 7,
            minDate : "2026-05-20",
            maxDate : "2026-05-24",
        });
        var picker5 = new Lightpick({ 
            field : $(".picker-5")[0],
            format : "YYYY-MM-DD",
            firstDay : 7,
            // maxDate : moment(),
            // maxDate : moment().subtract(1, "days"),//오늘을 빼고 싶다면
            maxDate : moment().subtract(1, "weeks"),//지난주까지
        });
        var picker6 = new Lightpick({ 
            field : $(".picker-6")[0],
            format : "YYYY-MM-DD",
            firstDay : 7,
            // maxDate : moment(),
            // maxDate : moment().subtract(1, "days"),//오늘을 빼고 싶다면
            // minDate : moment(), //오늘부터
            // minDate : moment().add(1, "days"), //내일부터 선택가능하게 
            // minDate : moment().add(1, "weeks"), //다음주부터 선택가능하게 
            // minDate : moment().add(1, "weeks").startOf("week"), //다음주의 시작하는 날부터
            minDate : moment().endOf("week").add(2, "days"),//다음주 월요일
        });
        var picker7 = new Lightpick({ 
            field : $(".picker-7")[0],
            format : "YYYY-MM-DD",
            firstDay : 7,
            minDate : moment().add(1, "months").startOf("months"),
            maxDate : moment().subtract(-1, "months").endOf("months"),
            numberOfMonths : 2, //2달 표시
            numberOfColumns : 2, 
            //선택이 불가능한 날짜 지정
            disableWeekends : true, //주말 선택 금지 
            disableDates : [
                "2026-06-03", "2026-06-06", "2026-07-17", //단일 날짜를 지정
                ["2026-7-27", "2026-07-30"], //범위로 지정
            ]
        });

        var picker8 = new Lightpick({ 
            field : $(".picker-8-1")[0],
            secondField : $(".picker-8-2")[0],
            singleDate : false,//범위 선택으로 변경
            format : "YYYY-MM-DD",
            firstDay : 7,
            minDate : moment().add(1, "months").startOf("months"),
            maxDate : moment().subtract(-1, "months").endOf("months"),
            numberOfMonths : 2, //2달 표시
            numberOfColumns : 2, 
            selectForward : true, //최초 선택날짜 이후로만 선택가능 
            minDays : 3, //최소 선택기간(일)
            maxDays : 7, //최대 선택기간(일)
        });
    });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>날짜 선택기(DatePicker)</h1>
        </div>
        <div class="cell">
            <h2>기본형태</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-1">
        </div>

        <div class="cell center">
            <h1>날짜 형식 변경</h1>
        </div>
        <div class="cell">
            <h2>기본형태2</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-2">
        </div>
        <div class="cell center">
            <h1>일요일 위치 변경</h1>
        </div>
        <div class="cell">
            <h2>기본형태3</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-3">
        </div>

        <div class="cell center">
            <h1>날짜의 범위설정(문자열로)</h1>
        </div>
        <div class="cell">
            <h2>기본형태4</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-4">
        </div>

        <div class="cell center">
            <h1>과거만 선택가능(momentjs이옹)</h1>
        </div>
        <div class="cell">
            <h2>기본형태5</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-5">
        </div>
        <div class="cell center">
            <h1>미래만 선택가능(momentjs이옹)</h1>
        </div>
        <div class="cell">
            <h2>기본형태6</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-6">
        </div>

        <div class="cell center">
            <h1>다음달만 선택가능(momentjs이옹)</h1>
        </div>
        <div class="cell">
            <h2>기본형태7</h2>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 picker-7">
        </div>

        <div class="cell center">
            <h1>날짜를 범위로 선택(DateRangePicker)</h1>
        </div>
        <div class="cell">
            <h2>기본형태8</h2>
        </div>
        <div class="cell flex-area">
            <input type="text" class="field w-100 picker-8-1">
            <i class="fa-solid fa-minus ms-10 me-10"></i>
            <input type="text" class="field w-100 picker-8-2">
        </div>

    </div>
</body>
</html>
