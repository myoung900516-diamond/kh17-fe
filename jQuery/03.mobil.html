<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
        
    </style>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            $(".keypad").on("click", function(){
                //this == 클릭한 버튼
                var size = $(this).data("size");
                $(".target").val(size + $(".target").val());
                //console.log(size);
            });
            $(".btn-delete").on("click", function(){
                var origin = $(".target").val();
                var cut = origin.substring(0, origin.length-1);
                $(".target").val(cut);
            });
            $(".btn-clear").on("click", function(){
                $(".target").val("");
            });            
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>휴대폰 키패드</h1>
        </div>
        <div class="cell">
            <input type="text" class="target field w-100">
        </div>

        <div class="cell flex-area">
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="7">7</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="8">8</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="9">9</button>
        </div>
        <div class="cell flex-area">
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="4">4</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="5">5</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="6">6</button>
        </div>
        <div class="cell flex-area">
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="1">1</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="2">2</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="3">3</button>
        </div>
        <div class="cell flex-area">
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="*">*</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="0">0</button>
            <button type="button" class="btn btn-neutral flex-fill keypad" data-size="#">#</button>
        </div>

        <div class="cell flex-area">
            <button type="button" class="btn btn-negative flex-fill btn-delete">지우기</button>
            <button type="button" class="btn btn-negative flex-fill btn-clear">처음부터</button>
        </div>


    </div>
</body>
</html>
