<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            var state = {
                bookTitleValid : false,
                bookAuthorValid : true,
                bookPublicationDateValid : true,
                bookPriceValid : false,
                bookPublisherValid : true,
                bookPageCountValid : false, 
                bookGenreValid : false,
                 
                ok : function(){
                    return Object.values(this)
                        .filter(v => typeof v === "boolean")
                        .every(v => v === true);  
                }
            };
            $("[name=bookTitle]").on("blur", function(){
                var value = $(this).val();
                var valid = value.length > 0 && value.length <= 300;
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                state.bookTitleValid = valid;
            });
            $("[name=bookAuthor]").on("blur", function(){
                var regex = /^[^!@#$]+$/;
                var value = $(this).val();
                var valid = value.length == 0 || regex.test(value);
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                state.bookAuthorValid = valid;
            });
            $("[name=bookPublicationDate]").on("blur", function(){
                var regex = /^([0-9]{4})-(((02)-(0[1-9]|1[0-9]|2[0-9]))|((0[469]|11)-(0[1-9]|1[0-9]|2[0-9]|30))|((0[13578]|1[02])-(0[1-9]|1[0-9]|2[0-9]|3[01])))$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                
                state.bookPublicationDateValid = valid;
            });         
            $("[name=bookPrice]").on("blur", function(){
                var price = parseInt($(this).val());
                var valid = price >= 0 && price <= 1000000000;
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                
                state.bookPriceValid = valid;
            });
            $("[name=bookPublisher]").on("blur", function(){
                $(this).addClass("success");
                
                
            });         
            $("[name=bookPageCount]").on("blur", function(){
                var pages = parseInt($(this).val());
                var valid = pages > 0;
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                
                state.bookPageCountValid = valid;
            });
            $("[name=bookGenre]").on("input", function(){
                var regex = /^(판타지|교양|소설|역사|과학|추리소설|자기계발|수험서)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.bookGenreValid = valid;
            });
            $("[inputmode=numeric]").on("input", function(){
                var regex = /[^0-9]+/g;
                var replacement = $(this).val().replace(regex, "");
                $(this).val(replacement);
            });
            $(".form-check").on("submit", function(){
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");

                return state.ok();
            });
            //(+추가) 파일 처리
            //-[name=attach]에 input이벤트가 발생하면 선택된 파일이 있을 경우 .preview에 미리보기 표시
            //(1) 진짜로 파일을 읽어와서 미리보기가 가능한 형태의 src를 생성한 뒤 설정하는 방법
            //  -장점 : 브라우저 무관하고 동일한 처리가 가능
            //  -단점 : 오래걸리고 코드 작성 난이도가 높음
            //(2) 브라우저가 제공하는 미리보기 기능을 활용하는 방법 
            // -장점 : 파일을 읽을 필요가 없음 
            // -단점 : 생성한 주소를 반드시 수동으로 제거해야 메모리 관리가 가능 (제거 안 하면 미리보기 메모리차지를 많이함)

            //(2)을 사용한 경우
            $("[name=attach]").on("input", function(){
                var originSrc = $(".preview").attr("src");//현재 .preview의 src를 가져와서
                if(originSrc.startsWith("blob:")){//생성된 주소가 존재한다면
                    URL.revokeObjectURL(originSrc);//생선된 주소를 회수하세요.

                }

                //this == 파일 입력창(files라는 내부 속성이 존재)
                if(this.files.length > 0){//파일을 선택한 경우(미리보기 생성)
                    var address = URL.createObjectURL(this.files[0]);//파일을 주고 주소 생성을 요청
                    $(".preview").attr("src", address);

                }
                else{//파일 선택을 취소한 경우(미리보기를 삭제할 수는없고, 더미이미지를  )
                    $(".preview").attr("src", "https://dummyimage.com/200x200?text=NO");
                }
                $(this).addClass("success");
            });
        });
        </script>
</head>
<body>
    <form action="./insert" method="post" enctype="multipart/form-data" 
    autocomplete="off" class="form-check">
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>도서 신규 등록</h1>
        </div>
        <div class="cell">
            <label>도서제목<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="bookTitle" class="field w-100">
            <div class="fail-feedback">필수 항목 입니다</div>
        </div>
        <div class="cell">
            <label>지은이</label>
            <input type="text" name="bookAuthor" class="field w-100">
            <div class="fail-feedback">특수문자는 사용하실 수 없습니다. </div>
        </div>
        <div class="cell">
            <label>출간일</label>
            <input type="date" name="bookPublicationDate" class="field w-100">
            <div class="fail-feedback">유효한 날짜가 아닙니다.</div>
        </div>
        <div class="cell">
            <label>가격<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="bookPrice" class="field w-100">
            <div class="success-feedback">판매가 설정이 완료되었습니다</div>
            <div class="fail-feedback">0원 이상 이어야 합니다.</div>
        </div>
        <div class="cell">
            <label>출판사</label>
            <input type="text" name="bookPublisher" class="field w-100">
        </div>
        <div class="cell">
            <label>페이지수<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="bookPageCount" class="field w-100">
            <div class="success-feedback"></div>
            <div class="fail-feedback">필수 항목입니다.</div>
        </div>
        <div class="cell">
            <label>장르<i class="fa-solid fa-asterisk red"></i></label>
            <select name="bookGenre" class="field w-100">
                <option value="">선택하세요</option>
                <option>판타지</option>
                <option>교양</option>
                <option>소설</option>
                <option>역사</option>
                <option>과학</option>
                <option>추리소설</option>
                <option>자기계발</option>
                <option>수험서</option>
            </select>
            <div class="success-feedback"></div>
            <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>표지</label>
            <input type="file" name="attach" accept=".png, .jpg" 
            multiple class="field w-100">
            <div class="success-feedback"></div>
            <div class="fail-feedback"></div>
        </div>
        <!-- 미리보기 추가 -->
        <div class="cell">
            <img class="preview" src="https://dummyimage.com/200x200?text=NO" width="200" height="200">
        </div>
        <div class="cell right">
            <button type="button" class="btn btn-neutral">
                <i class="fa-solid fa-list"></i>
                목록으로
            </button>
            <button type="submit" class="btn btn-positive">
                <i class="fa-solid fa-plus"></i>등록하기
            </button>
        </div>


               
                
    </div>
    </form>
</body>
</html>
