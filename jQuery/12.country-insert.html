<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //상태객체
            var state = {
                countryNameValid : false,
                countryRegionValid : false, 
                countryCapitalValid : false, 
                countryPopulationValid : false,
                ok : function(){
                    return Object.values(this)//이 객체의 모든 이름에 대한 값을 반환해라. (람다)
                        .filter(v => typeof v === "boolean")//boolean값만 추출해서 
                        // .filter(function(v)){
                        //     return typeof v == "boolean"
                        // })
                        .every(v => v === true); //모두 true인지 확인해서 반환해라! 
                        // .every(function(v){
                        //     return v === true;
                        // })
                }
            };

            //개별입력창검사
            // document.querySelector("[name=countryRegion]")
            $("[name=countryRegion]").on("input", function(){
                var regex = /^(아시아|아프리카|[남북]아메리카|유럽|오세아니아)$/;
                // var valid = regex.test(this.value);
                var valid = regex.test($(this).val());
                // this.classList.remove("success", "fail");
                // this.classList.add(valid ? "success" : "fail");
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.countryRegionValid = valid;//외부 state에 보관
            });
            $("[name=countryName]").on("blur", function(){
                var regex = /^[가-힣]{1,10}$/;
                // var valid = regex.test(this.value);
                var valid = regex.test($(this).val());

                // this.classList.remove("success", "fail");
                // this.classList.add(valid? "success": "fail");
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                //return valid; //구조적으로 쓸 수 없는 의미없는 코드 //콜백때매 다 바뀌는 거거든요. 
                state.countryNameValid = valid;//state에보관 
            });
            $("[name=countryCapital]").on("blur", function(){
                var valid = $(this).val().length > 0;
                // this.classList.remove("success", "fail");
                // this.classList.add(valid? "success": "fail");
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                state.countryCapitalValid = valid;//state에 보관
            });

            $("[name=countryPopulation]").on("blur", function(){
                var value = $(this).val();
                var valid = value.lenth > 0 && parseInt(value) > 0;
                // this.classList.remove("success", "fail");
                // this.classList.add(valid? "success": "fail");
                $(this).removeClass("success fail").addClass(valid? "success": "fail");
                state.countryPopulationValid = valid;
            });
            //숫자 입력창 처리
            //반복문 없이 한번에 처리 jQuery니까
            $("[inputmode=numeric]").on("input", function(){
                var regex = /[^0-9]+/g;
                var replacement = $(this).val().replace(regex, "");
                $(this).val(replacement);
            });
            //폼검사
            $(".form-check").on("submit", function(){
                //화면처리(이벤트 트리거)
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");

                return state.ok();
            });

        });
    </script>
</head>
<body>
<form action="" method="post" autocomplete="off" class="form-check">

        <div class="container w-600 mt-50 mb-50">
            <div class="cell center">
                <h1>국가정보등록(jQuery)</h1>
            </div>
            <div class="cell">
            <label>대륙명 <i class="fa-solid fa-asterisk red"></i></label>            
            <select name="countryRegion" class="field w-100">
                <option value="">선택하세요</option>
                <option>아시아</option>
                <option>아프리카</option>
                <option>북아메리카</option>
                <option>남아메리카</option>
                <option>유럽</option>
                <option>오세아니아</option>
            </select>
            <!-- <div class="success-feedback"></div> -->
            <div class="fail-feedback">필수 항목입니다</div>
            </div>
            <div class="cell">
                <label>국가명 <i class="fa-solid fa-asterisk red"></i> </label>
                <input type="text" name="countryName" class="field w-100">
                <div class="success-feedback">올바른 형식의 이름입니다</div>
                <div class="fail-feedback">한글로만 작성 가능합니다!</div>
            </div>
            <div class="cell">
                <label>수도명 <i class="fa-solid fa-asterisk red"></i> </label>
                <input type="text" name="countryCapital" class="field w-100">
                <div class="fail-feedback">필수항목입니다!</div>
            </div>
            
            <div class="cell">
                <label>인구 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" name="countryPopulation"
                        class="field w-100">
                <div class="fail-feedback">0보다 큰 숫자만 가능합니다</div>
            </div>
            <div class="cell mt-50">
                <button type="submit" class="btn btn-positive w-100">등록하기</button>
            </div>
            
            
        </div>
    </form>
</body>
</html>
