<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //목표 : 잠금/잠금해제 버튼을 누르면 입력창에 readOnly를 설정 또는 해제

            $(".btn-lock").on("click", function(){
                //document.querySelector(".target").readOnly = true;//JS

                //$(".target").attr("readonly", "readonly");
                $(".target").prop("readonly", true);//readonly를 활성화시켜라!
            });
            $(".btn-unlock").on("click", function(){
                $(".target").prop("readonly", false);
            });
            $(".btn-date").on("click", function(){
                //$(".target").prop("type", "date");//똑같어
                $(".target").attr("type", "date");//똑같어
            });
            $(".btn-text").on("click", function(){
                $(".target").prop("type", "text");
            });
            //attr은 현대 대상에 존재하지 않는 속성을 만들거나 불러올 수 있다.
            $(".btn-dataset").on("click", function(){
                $(".target").attr("data-number", "5000");
            });
        });

    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>prop()과 attr()의 차이</h1>
        </div>

        <div class="cell mt-50">
            <input type="text" class="field w-100 target">
        </div>
        <div class="cell">
            <button type="button" class="btn btn-neutral btn-lock">
                <i class="fa-solid fa-lock"></i>
                입력창 잠금</button>
            <button type="button" class="btn btn-neutral btn-unlock">
                <i class="fa-solid fa-unlock"></i>
                입력창 잠금해제</button>
        </div>
        <div class="cell">
            <button type="button" class="btn btn-neutral btn-date">날짜입력</button>
            <button type="button" class="btn btn-neutral btn-text">텍스트입력</button>
        </div>
        <div class="cell">
            <button type="button" class="btn btn-neutral btn-dataset">데이터셋 추가</button>
        </div>


    </div>
</body>
</html>
