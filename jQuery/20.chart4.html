<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery 수업</title>
  <link rel="icon" href="/kh.png" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    type="text/css">
  <link rel="stylesheet" href="../css/commons.css" type="text/css">
  <style>
    div {
      box-shadow: 0 0 0 1px #cccccc;
    }
  </style>
  <!-- chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jQuery CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- 자바스크립트 작성 영역 -->
  <script>
    $(function () {
      //시작하자마자 차트를 만들지 말고 서버에 물어본 뒤 받은 데이터로 차트를 생성

      $.ajax({
        url:"http://localhost:8080/rest/stat/country-region",
        method:"post",
        success : function(response){
          const ctx = $(".custom-chart")[0];
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: response.titles,
              datasets: [
                {
                  label: '대륙별 국가수',
                  data: response.values,
                  borderWidth: 1
                }
              ]
            },
            options: {
              scales: {
                y: {
                  beginAtZero: true
                }
              }
            }
          });

        }
      });
    });
  </script>
</head>

<body>
  <div class="container w-600 mt-50 mb-50">
    <div class="cell center">
      <h1>차트다루기</h1>
    </div>
    <div class="cell">
      <canvas class="custom-chart"></canvas>
    </div>

  </div>
</body>

</html>
