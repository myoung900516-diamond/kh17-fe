<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //상태객체
            var state = {
                lectureTitleValid : false,
                lectureCategotyValid : false,
                lectureDurationValid : false,
                lecturePriceValid : false,
                lectureTypeValid : false,
                ok : function(){
                    return Object.values(this)//이 객체의 모든 이름에 대한 값을 반환해라. (람다)
                        .filter(v => typeof v === "boolean")//boolean값만 추출해서 
                        // .filter(function(v)){
                        //     return typeof v == "boolean"
                        // })
                        .every(v => v === true); //모두 true인지 확인해서 반환해라! 
                        // .every(function(v){
                        //     return v === true;
                        // })
                }
            };
            //개별항목
            $("[name=lectureTitle]").on("blur", function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.lectureTitleValid = valid;
            });
            $("[name=lectureCategory]").on("input", function(){
                var regex = /^(이론|실습|시험)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.lectureCategotyValid = valid;
            });
            $("[name=lectureDuration]").on("blur", function(){
                var value = $(this).val();
                var duration = parseInt(value);
                var valid = duration <= 300 && duration >0;
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.lectureDurationValid = valid;
            });
            $("[name=lecturePrice]").on("blur", function(){
                var value = $(this).val();
                var price = parseInt(value);
                var valid = price > 0 && price <= 10000000000;
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.lecturePriceValid = valid;
            });
            $("[name=lectureType]").on("input", function(){
                var regex = /^(온라인|오프라인|혼합)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid? "success": "fail");

                state.lectureTypeValid = valid;
            });

            //유틸리티
            $("[inputmode=numeric]").on("input", function(){
                var regex = /[^0-9]+/g;
                var replacement = $(this).val().replace(regex, "");
                $(this).val(replacement);
            });

            //폼검사
            $(".form-check").on("submit", function(){
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");

                return state.ok();
            });

        });

    </script>
    <script type="text/javascript">
        //이미지 미리보기처리(개수무관)
        $(function(){
            $(".preview-input").on("input", function(){

                //기존에 .preview-area에 있는 이미지를 제거 
                //  -있을지 없을지 모르며 있다면 URL.revokeObjectURL()을 써서 회수까지 해줘야함
                //  -jQuery에서 제공하는 반복함수 each를 사용(for보다 편함)
                $(".preview-area").find("img").each(function(){
                    //this == 이미 있던 이미지들 반복할 이미지들 
                    //이미지 주소 회수 + 이미지 태그 삭제 (or 영역 비우기)

                    var address = $(this).attr("src");
                    URL.revokeObjectURL(address);
                    //위 두줄을 안하면 성능하락이 됨
                    $(this).remove();
                });
                //영역 비우기
                $(".preview-area").empty();

                //미리보기 생성
                if(this.files.length > 0){//파일 선택
                    for(var i=0; i<this.files.length;i++){//선택한 파일수만큼
                        //이미지 태그를 만들어서
                        var img = $("<img>")
                            .addClass("image-shadow image-round")
                            .attr("src", URL.createObjectURL(this.files[i]))
                            .prop("height", 100);
                        //.preview-area에 추가
                        $(".preview-area").append(img);

                    }
                }
                else{//파일 선택 취소

                }
            });
        });
    </script>
</head>
<body>
    <form action="" method="post" enctype="multipart/form-data" class="form-check">
        <div class="container w-600 mt-50 mb-50">
            <div class="cell center">
                <h1>강의등록화면</h1>
            </div>
            <div class="cell">
                <label>강의명<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="lectureTitle" placeholder="입력하세요"  class="field w-100">
                <div class="fail-feedback">필수 항목입니다</div>
            </div>
            <div class="cell">
                <label>강의형태<i class="fa-solid fa-asterisk red"></i></label>
                <select name="lectureCategory"  class="field w-100">
                    <option value="">선택하세요</option>
                    <option>이론</option>
                    <option>실습</option>
                    <option>시험</option>
                </select>
                <div class="fail-feedback">필수 항목입니다</div>
            </div>
            <div class="cell">
                <label>강의 시간<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" name="lectureDuration" value="0"  class="field w-100">
                <div class="fail-feedback">30시간 단위로 입력하세요(300시간이하)</div>
            </div>
            <div class="cell">
                <label>강의료<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" name="lecturePrice" value="0"  class="field w-100">
                <div class="fail-feedback">0원 이상 입력하세요</div>
            </div>
            <div class="cell">
                <label>강의유형<i class="fa-solid fa-asterisk red"></i></label>
                <select name="lectureType" class="field w-100">
                    <option value="">선택하세요</option>
                    <option>온라인</option>
                    <option>오프라인</option>
                    <option>혼합</option>
                    <div class="fail-feedback">필수항목입니다</div>
                </select>
            </div>
            <div class="cell mt-50">
                <label>미리보기</label>
                <input type="file" name="attach" accept=".png, .jpg" multiple class="field w-100 preview-input">
            </div>
            <div class="cell preview-area">

            </div>
            <div class="cell">
                <button type="submit" class="btn btn-positive w-100"> 
                    <i class="fa-solid fa-plus"></i>등록하기
                </button>
            </div>
        </div>
    </form>
</body>
</html>
