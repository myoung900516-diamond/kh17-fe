<!DOCTYPE html>

<head>

    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet"

    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
        
    </style>
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //[1] 1페이지 빼고 다 숨김
            //$(".page").hide();
            // $(".page").eq(0).show();
            // $(".page").first().show();
            $(".page").hide().first().show();

            //[2] 다음 버튼을 누르면 현재 페이지 숨기고 다음 페이지를 보여준다. 
            $(".btn-next").on("click", function(){
                //$(this).parent(".page").hide();
                // $(this).parent(".page").next(".page").show();
                // $(this).parents(".page").hide().next(".page").show();
                $(this).closest(".page").hide().next(".page").show();
            });
            //[3] 이전버튼을 누르면 현재 페이지를 숨기고 이전 페이지를 보여준다. 
            $(".btn-prev").on("click", function(){
                // $(this).parents(".page").hide().prev(".page").show();
                $(this).closest(".page").hide().prev(".page").show();
            });




        });

    </script>
</head>
