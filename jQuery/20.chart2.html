<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery 수업</title>
  <link rel="icon" href="/kh.png" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    type="text/css">
  <link rel="stylesheet" href="../css/commons.css" type="text/css">
  <style>
    div {
      box-shadow: 0 0 0 1px #cccccc;
    }
  </style>
  <!-- chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jQuery CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- 자바스크립트 작성 영역 -->
  <script>
    $(function () {

      //const ctx = document.querySelector(".custom-chart");
      const ctx = $(".custom-chart")[0];
      //차트 생성 - new Chart(태그, {옵션});
      new Chart(ctx, {
        //type은 차트의 유형(bar/line/pie/doughnut)
        type: 'bar',
        //data는 차트를 그리기 위한 값의 정보
        data: {
          //labels가 x축에 표시될 이름 
          labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
          //datasets은 차트에 그릴 데이터 집합들(복수개 가능)
          datasets: [
            {
              //label : 범례
              label: '첫 번째 데이터',
              data: [12, 19, 3, 5, 2, 3],
              borderWidth: 1
            },
            {
              //label : 범례
              label: '두 번째 데이터',
              data: [15, 23, 2, 4, 4, 1], 
              borderWidth: 1
            },
            {
              //label : 범례
              label: '세 번째 데이터',
              data: [10, 20, 6, 7, 2, 1],
              borderWidth: 1
            },
            {
              //label : 범례
              label: '네 번째 데이터',
              data: [9, 15, 7, 9, 8, 10],
              borderWidth: 1
            }
          ]
        },
        //차트를 표시하기 위한 옵션
        options: {
          scales: {
            y: {
              beginAtZero: true //true: y축을 무조건 0부터 시작하도록 처리 //false: 가장 작은 데이터부터 처리
            }
          }
        }
      });

    });
  </script>
</head>

<body>
  <div class="container w-600 mt-50 mb-50">
    <div class="cell center">
      <h1>차트다루기</h1>
    </div>
    <div class="cell">
      <canvas class="custom-chart"></canvas>
    </div>

  </div>
</body>

</html>
