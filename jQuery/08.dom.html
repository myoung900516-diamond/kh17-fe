                // $(this).parent(".cell").prev(".cell").children(".target").remove();//태그가 지워짐 쓰레기통을 버리는 것 

                //숨기기
                // $(this).parent(".cell").prev(".cell").children(".target").css("display", "none");//가장 일반적으로 생각하는 숨김

                // $(this).parent(".cell").prev(".cell").children(".target").fadeIn();
                $(this).parent(".cell").prev(".cell").children(".target").fadeToggle();
            });
