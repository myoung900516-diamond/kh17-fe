<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
<!-- 디자인을 작성하기 위한 영역 -->
    <style>
        *{
            /* 전체에 설정 */
            /* 이제부터 폭과 높이는 테두리가 기준이다 */
            box-sizing: border-box;
        }
        .first{
            /* 글꼴 속성 */
            font-family: 굴림, sans-serif;
            font-size: 50px;
            color: chocolate;
            /* font-weight: bold; */
            /* font-style: italic; */

            /* 배경 속성 */
            /* css1 */
            background-color: cadetblue;

            /* css3 */
            background: #2A7B9B;
            background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
        }
        .second{
            /* 테두리 디자인(border-*) */
            border-width: 2px;
            border-style: solid;
            border-color: brown;
            border-radius: 300px;
            /* border: 2px solid brown */

            /* 입력창과 같이 포커스 효과가 있는 경우 제거하는 속성 */
            outline: none;

            /* 내부여백(padding)
                -글자가 중요한 태그라면 em을 쓸 수 있음
                -1em은 글자 1개의 높이
                -px로도 부여할 수 있으니 상황에 맞게 선택
                -부위별로 부여도 가능(top, bottom, left, right) 
                -2개로 나워쓰면 상하/ 좌우
                -4개로 나눠쓰면 시계방향 (12시/3시/6시/9시)
             */
            /* padding: 17px; */
            padding: 1em;
        }
        .third{
            /* 크기 설정 : width, height */
            width: 600px;
            height: 50px;
            
        }
    </style>
</head>
<body>
    <h1>기본 디자인 속성들</h1>

    <input type="text" class="first">
    <br><br>
    <input type="text" class="second">
    <br><br>
    <input type="text" class="third">


</body>
</html>
