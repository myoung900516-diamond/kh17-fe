<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <style>
        /* 시각화테스트 */
        /* ul{ box-shadow: 0 0 0 1px black; } */
        /* li{ box-shadow: 0 0 0 1px blue; } */
        /* a{ box-shadow: 0 0 0 1px red; } */
        /* (1) ul 태그의 기본 스타일 제거*/
        .menu ,
         /* .sub-menu{ */
        .menu ul{
            list-style: none;
            padding: 0;
            margin: 0;
        }
        /* (2) 서브메뉴를 숨김 */
        /* .sub-menu{ */
        .menu ul{
            display:none;
        }
        /* (3) 메뉴를 가로로 나오게 배치 */
        .menu{
            display:flex;
        }
        /* (4) 1차(x) 모든 메뉴에 폭과 여백 지정 */
        /* .menu > li{ */
        .menu li{
            width: 120px;
            font-size: 20px;
            font-weight: bold;
            padding:0.25em;
            text-align: center;
        }
        /* (5) 메뉴에 마우스가 올라가면 하위 메뉴를 출력 */
        .menu li:hover > 
        /* .sub-menu{ */
        ul{
            display: block;
        }
        /* (6) 하위메뉴는 absolute배치를 통해 다음 컨텐츠의 위치에 
        영향을 주지 않도록 변경(기준영역설정) */
        .menu li{
            position: relative;
        }
        /* .sub-menu{ */
        .menu ul{
            position: absolute;
            left: 0;
            /* right: 0; */
            width: 120px;
            top: 100%;
        }
        /* (7) 좌우 분리를 위한 .divider 생성 */
        .menu > .divider{
            width: 0px !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        /* (8) 메뉴, 항목, 링크의 디자인 변경 */
        .menu,
        .menu ul{
            background-color: rgb(53, 50, 50);
            color:rgb(188, 191, 194);
        }
        .menu a{
            color: inherit;
            background-color: inherit;
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
        }
        /* .menu a:hover{ */
        .menu li:hover{
            background-color: rgb(100, 96, 96);
        }
    </style>
</head>
<body>
    <!-- 메뉴를 ul,li를 이용해서 구현해보자
      -->
    <ul class="menu">
        <!-- 1차메뉴:가로바에 보이는 항목들 -->
        <li>

            <!-- 2차메뉴 : 1차 메늉 마우스가 올라가면 펼쳐지게 될 하위메뉴 -->
             <ul class="sub-menu">
                <li>

                </li>
                <li>

                </li>
             </ul>
        </li>
        <li>
            <a href="#">1차메뉴</a>
            <!-- 2차메뉴 : 1차 메늉 마우스가 올라가면 펼쳐지게 될 하위메뉴 -->
             <ul class="sub-menu">
                <li>

                </li>
                <li>

                <li>

                </li>
                <li>
                    <a href="#">2차메뉴</a>
                </li>
             </ul>
        </li>
        <li>
            <a href="#">1차메뉴</a>
            <!-- 2차메뉴 : 1차 메늉 마우스가 올라가면 펼쳐지게 될 하위메뉴 -->
             <ul class="sub-menu">
                <li>

        <!-- 좌/우 메뉴 경계선 -->
