<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 : 로그인</title>
    <link rel="icon" href="./images/naver.png" type="image/jpeg">
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <style>
        /* 영역을 시각적으로 보이게 만드는 테스트 코드 */
        div{
            /* box-shadow: 0 0 0 1px gray;  */
        }
        /* 컨테이너 디자인 */
        
        /* input{
            width: 100%;
            font-family: sans-serif;
            font-size: 16px;
            padding: 0.75em;
            border-radius: 0.5em;
            outline: none;
            border-style: solid;
            border-color: darkgray;
            border-width: 1px;
        } */
        input[name=memberId]{
            width: 100%;
            font-family: sans-serif;
            font-size: 16px;
            padding: 0.75em;
            outline: none;
            border-top-left-radius: 0.75em;
            border-top-right-radius: 0.75em;
        }
        input[name=memberPassword]{
            width: 100%;
            font-family: sans-serif;
            font-size: 16px;
            padding: 0.75em;
            outline: none;
            border-bottom-right-radius: 0.75em;
            border-bottom-left-radius: 0.75em;
        }
        button.btn-login{
            width: 100%;
            background-color: gray;
            color: aliceblue;
            font-family: sans-serif;
            font-size: 16px;
            padding: 0.5em;
            border-radius: 0.5em;
            outline: none;
            border-style: solid;
            border-color: aliceblue;
        }
        button.btn-passkey{
            background-color: aliceblue;
           font-family: sans-serif;
            font-size: 16px;
            color: green;
            text-decoration: none;
            font-weight: bold;
            border-color: green;
            border-style: solid;
            border-width: 1px;
            border-radius: 0.5em;
            width: 100%;
            padding: 0.5em;
        }

    </style>
</head>
<body>
    <!-- 컨테이너(container) : 가장 작은 화면 단위 -->
    <div class="container" style="width: 410px;">
        <!-- 셀(cell) : 화면의 한 줄 -->
        <div class="cell center">
            <img src="./images/naver logo.png" width="200">
        </div>
        <div class="cell" style="margin-top: 40px; margin-bottom: 0;">
            <input type="text" name="memberId" required 
                 placeholder="아이디 또는 전화번호">
        </div>
        <div class="cell" style="margin-top: 0;">
            <input type="password" name="memberPassword" required 
                placeholder="비밀번호">
        </div>
        <div class="cell">
            <input type="checkbox">로그인 상태 유지
        </div>
        <div class="cell" style="margin-top: 20px;">
            <button class="btn-login">
                로그인
            </button>
        </div>
        <hr style="margin-top: 20px;">
        <div class="cell center" style="margin-top: 20px;">
            <a href="#">
            <button class="btn-passkey">
                패스키 로그인
            </button>
            </a>
        </div>
    </div>
</body>
</html
