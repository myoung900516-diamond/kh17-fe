<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡: 로그인</title>
    <link rel="icon" href="./images/coupang.png" type="image/jpeg">
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <style>
        .field{
            border-radius: 0;
        }
        .btn.btn-positive{
            background-color: #346AFF;
            border-color: #346AFF;
            color: #fafeff;
            /* border-radius: 0.25em;
            letter-spacing: 0.10em; */
        }
        .btn.btn-neutral{
            /* border-radius: 0.25em; */
            border-color: rgb(177, 177, 177);
            background-color: white;
        }
        /* a{
            text-decoration: none;
            color: rgb(53, 51, 51);
            font-weight: bold;
            font-size: 14px;
            color: rgb(128, 130, 133);
            letter-spacing: 0.10em;
        } */
    </style>
</head>
<body>
    <div class="container w-450 mt-50">
        <div class="cell center" style="margin-top: 100px;"><img src="./images/coupang.png" width="200"></div>
        <div class="cell mt-40">
            <input type="text" name="memberId" required 
                    placeholder="아이디(이메일)" 
                    class="field w-100">    
        </div>
        <div class="cell mt-20">
            <input type="password" name="memberPassword" required 
                    placeholder="비밀번호" 
                    class="field w-100">
        </div>
        <div class="cell mt-30">
            <button class="btn btn-positive w-100">
                로그인
            </button>
        </div>
        <hr>
        <div class="cell mt-20 mb-20">
            <button class="btn btn-neutral w-100">
                회원가입
            </button>
        </div>
    </div>
</body>
</html>
