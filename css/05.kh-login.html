<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
<!-- 디자인을 작성하기 위한 영역 -->
    <style>
        *{
            box-sizing: border-box;
        }
        h1{
            width: 430px;
            text-align:center;
            /* auto는 가능한 많이(알아서)라는 뜻 */
            /* margin-left: auto;
            margin-right: auto; */
            margin: 20px auto;
        }
        input[name=memberId], input[name=memberPassword]{
            font-family: sans-serif;
            font-size: 20px;
            width: 430px;
            padding: 0.5em;
            outline: none;
            margin: 8px;
        }
        button{
            font-family: sans-serif;
            font-size: 20px;
            width: 430px;
            padding: 0.5em;
            background-color: black;
            color: aliceblue;
        }
        hr{
            width: 430px;
        }
        div{
            width: 430px;
            font-size: 14.5px;
            margin:auto;
            text-align: left;
        }
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>로그인</h1>
    <form autocomplete="off">
        <input type="text" name="memberId" required placeholder="아이디 (*이메일 형식 입력불가)"><br>
        <input type="password" name="memberPassword" required placeholder="비밀번호"><br>
        <button>로그인</button>
        <div>
            <input type="checkbox">아이디저장
        </div>
        <hr>
        <div>
            ·수강생은 현재 페이지 https://kh-academy.co.kr/login/login.kr를 
            즐겨찾기 추가해주세요.
        </div>
    </form>
</body>
</html>
