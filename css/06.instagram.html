<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram</title>
    <link rel="icon" href="./images/instagram.png" type="image/jpeg">
<!-- 디자인을 작성하기 위한 영역 -->
    <style>
        *{
            box-sizing: border-box;
        }
        body{
           text-align: center;
        }
        img{
            margin: auto;
        }
        hr{
            width: 530px;
            
            margin-bottom: 100px;
        }
        h3{
            text-align: left;
            margin-top: 100px;
            font-weight: bold;
            margin: 30px auto;
            width: 530px; 
            font-size: 16px;          
        }
        input{
            display: block;
            width: 530px;
            height: 40px;
            margin: 15px auto;
            font-family: sans-serif;
            font-size: 16px;
            padding: 0.75em;
            border-radius: 0.5em;
            outline: none;
            border-style: solid;
            border-color: darkgray;
            border-width: 1px;
        }
        button{
            display: block;
            margin: 20px auto;
            height: 40px;
            width: 530px;
            background-color: dodgerblue;
            color: aliceblue;
            font-family: sans-serif;
            font-size: 16px;
            padding: 0.5em;
            border-radius: 100px;
            outline: none;
            border-style: solid;
            border-color: aliceblue;
        }
        a{
            font-family: sans-serif;
            font-size: 16px;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <img src="./images/instagram.png" width="100">
    <hr>
    <h3>instagram으로 로그인</h3>
    <form>
        <input type="text" name="memberId" required 
        placeholder="휴대폰 번호, 사용자 이름 또는 이메일 주소">
        <input type="password" name="memberPassword" required 
        placeholder="비밀번호">
        <button>로그인</button>
    </form>
    <a href="#">비밀번호를 잊으셨나요?</a>
</body>
</html>
