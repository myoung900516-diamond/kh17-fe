<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- favicon -->
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
        
    </style>
</head>
<body>
    <div class="container my-5">
        <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                    <h1>모달 로그인</h1>
                    <p>모달을 이용하여 로그인 화면을 팝업 형태로 구현합니다.</p>
                </div>
            </div>
        </div>
    
    

        <!-- 실제로 구현할 내용들 -->
        
        <div class="row mt-4">
            <div class="col">
                <button type="button" class="btn btn-primary btn-login">로그인</button>
            </div>
        </div>
    </div>

    <div class="modal fade" tabindex="-1" id="login-modal" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title w-100 text-center"></h5>
                    <button type="button" class="btn-close"></button>
                </div>
                <div class="modal-body">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col text-center">
                                <h3>회원 로그인</h3>
                            </div>
                        </div>
                        <div class="row mt-4">
                            <label class="col-sm-3 col-form-label">아이디</label>
                            <div class="col-sm-4">
                                <input type="text" name="memberId" class="form-control">
                            </div>
                        </div>
                        <div class="row mt-4">
                            <label class="col-sm-3 col-form-label">비밀번호</label>
                            <div class="col-sm-4">
                                <input type="text" name="memberPassword" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-success btn-login-proc">로그인</button>
                </div>
            </div>
        </div>
    </div>

   


    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
        $(function(){
            $(".btn-login").click(function(){
                $("#login-modal").modal("show");
            });
            $(".btn-login-proc").click(function(){
                $("#login-modal").modal("hide");

                window.alert("환영합니다");
            });
            $(".btn-close").click(function(){
                $("[name=memberId],[name=memberPassword]").val("");
                // $("#login-modal").modal("hide");
            });
        });
    </script>
  </body>
</html>
