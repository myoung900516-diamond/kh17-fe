<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- favicon -->
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
        
    </style>

</head>
<body>
    <div class="container my-5">
        <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                    <h1>모달(Modal)</h1>
                    <p>window alert 대신 사용하는 알림창</p>
                </div>
            </div>
        </div>

        <!-- window alert의 단점 : 
            1.디자인을 맞춤설정할 수 없다. 브라우저마다 모양이 다르다. 디자인적으로 특장점이 없다. 
            2.확인을 누르지 않으면 다른 어떤 작업을 할 수 없다(사용자를 거슬리게 한다)
            3.브라우저옵션에 알림창들을 차단할 수 있다. 개발자는 골치가 아프다. 
        -->
        <!-- 1번 보달 제어버튼 -->
        <div class="row mt-4">
            <div class="col">
                <!-- 부트스트랩 기본 제공 기능을 사용하려면 data-bs-로 시작하는 속성을 만들어야함 -->
                <button class="btn btn-primary" 
                        data-bs-target="#modal01" 
                        data-bs-toggle="modal">1번 모달 열기</button>
                <button class="btn btn-primary" 
                        data-bs-target="#modal02" 
                        data-bs-toggle="modal">2번 모달 열기</button>
                <button class="btn btn-primary btn-modal03-open">3번 모달 열기</button>
            </div>
        </div>

        

    </div>
    <!-- modal은 처음부터 표시되지 않으며 레이아웃의 영향을 받지 않으므로 맨 마지막에 배치하는게 일반적  -->

    <!-- 1번(기본형) -->
    <div class="modal fade" tabindex="-1" id="modal01">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">모달 제목</h5>
                    <!-- 자동으로 닫고 싶을 경우 bs 옵션 작성 -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button> 
                </div>
                <div class="modal-body">
                    (공지)내일부터는 리액트 수업을 합니다.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2번(정적 백드롭) -->
    <div class="modal fade" tabindex="-1" id="modal02" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">모달 제목</h5>
                    <!-- 자동으로 닫고 싶을 경우 bs 옵션 작성 -->
                    <!-- <button type="button" class="btn-close" data-bs-dismiss="modal"></button>  -->
                </div>
                <div class="modal-body">
                    (공지)모두 빠짐없이 출석하세요.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3번 (수동으로 열고 닫기) -->
    <div class="modal fade" tabindex="-1" id="modal03" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">모달 제목</h5>
                    <!-- 자동으로 닫고 싶을 경우 bs 옵션 작성 -->
                    <!-- <button type="button" class="btn-close" data-bs-dismiss="modal"></button>  -->
                </div>
                <div class="modal-body">
                    (공지)출석하실 분들은 확인을 누르세요
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-absent">불참</button>
                    <button type="button" class="btn btn-primary btn-confirm">참여</button>
                </div>
            </div>
        </div>
    </div>
    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
        $(function(){
            //목표 : btn-modal03-open을 클릭하면 #modal03을 표시
            $(".btn-modal03-open").click(function(){
                //bootstrap js에서 jquery에 modal과 같은 신규 명령을 자동으로 추가(플러그인 방식)
                //jQuery 버전
                // $("#modal03").modal("show");

                //VanillaJs버전
                //1. 태그선택
                var target = document.querySelector("#modal03");
                //2.Bootstrap 객체로 획득
                var modal = bootstrap.Modal.getOrCreateInstance(target);
                //3.명령실행
                modal.show();
            });
            //목표 : 참여버튼을 누르면 #modal03을 닫기
            $(".btn-confirm").click(function(){
                //jQuery버전
                // $("#modal03").modal("hide");

                //VanillaJS버전

                //1.태그 선택
                var target = document.querySelector("#modal03");
                //2.Bootstrap객체로 획득
                var modal = bootstrap.Modal.getInstance(target);
                //3.명령 실행
                modal.hide();

                $(".btn-modal03-open").text("참여선택").removeClass("btn-primary btn-success btn-secondary").addClass("btn-success");
            });
            $(".btn-absent").click(function(){
                $("#modal03").modal("hide");
                $(".btn-modal03-open").text("불참선택").removeClass("btn-primary btn-success btn-secondary").addClass("btn-danger");
            });
        });
    </script>
  </body>
</html>
