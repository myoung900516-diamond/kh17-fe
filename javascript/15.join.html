<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>

        function checkMemberId(){
            var memberId = document.querySelector(".memberId");
            var regex = /^[a-z0-9][a-z0-9]{4,19}$/;
            var message = document.querySelector(".check");
            if(regex.test(memberId.value)){
                message.style.color = "red";
                message.textContent = '멋진 아이디입니다!';
            }
            else{
                message.style.color = "blue";
                message.textContent = '아이디는 영문 소문자로 시작하고 숫자 포함 5~20자로 작성하세요';
            }
        }
        function checkMemberPw(){
            var memberPw = document.querySelector(".memberPw");
            var regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,16}$/;
            var message = document.querySelector(".check2");
            if(regex.test(memberPw.value)){
                message.style.color = "blue";
                message.textContent = '올바른 비밀번호 형식입니다.';
            }
            else{
                message.style.color = "red";
                message.textContent = '영문 대문자, 소문자, 숫자, 특수문자를 반드시 1개 이상 포함한 8~16글자로 작성하세요';
            }
        }
        function checkEqualPw(){
            var pw = document.querySelector(".memberPw").value;
            var pwCheck = document.querySelector(".memberPwCheck").value;
            var message = document.querySelector(".check3");

            if(pwCheck.length == 0){
                message.textContent = "";
                return;
            }

            if(pw === pwCheck){
                message.style.color = "blue";
                message.textContent = "비밀번호가 일치합니다.";
            }
            else{
                message.style.color = "red";
                message.textContent = "비밀번호가 일치하지 않습니다.";
            }
        }
        

    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>회원가입</h1>
        </div>
        <div class="cell">
            <span style="font-size: 18px;">아이디</span>
            <i class="fa-solid fa-asterisk" style="color: red;"></i>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 memberId" oninput="checkMemberId();">
        </div>
        <div class="cell">
            <span class="check"></span>
        </div>
        <div class="cell">
            <span>비밀번호</span>
            <i class="fa-solid fa-asterisk" style="color: red; font-size="10px"></i>
        </div>
        <div class="cell">
            <input type="password" class="field w-100 memberPw" oninput="checkMemberPw();">
        </div>
        <div class="cell">
            <span class="check2"></span>
        </div>
        <div class="cell">
            <span>비밀번호확인</span>
            <i class="fa-solid fa-asterisk" style="color: red; font-size="10px"></i>
        </div>
        <div class="cell">
            <input type="password" class="field w-100 memberPwCheck" oninput="checkEqualPw();">
        </div>
        <div class="cell">
            <span class="check3"></span>
        </div>



    </div>
</body>
</html>
