<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}

        /* 체크 상태에 따른 아이콘 표시 제어 */
        .togglebox {display: none;}
        .togglebox ~ .blue{ display: none; }
        .togglebox ~ .red{ display: inline; }
        .togglebox:checked ~ .blue { display: inline;}
        .togglebox:checked ~ .red{ display: none;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //체크박스를 체크하면 input태그의 type이 password에서 text로 바뀌고 눈모양 아이콘으로 바뀐다.
        function togglePassword(){
            //체크박스가 아니라 아이콘이기 때문에 클래스를 가지고 검사해야함 
            var toggleBox = document.querySelector(".togglebox");
            var fields = document.querySelectorAll("[name=memberPassword], .password-check")
            for(var i = 0; i < fields.length; i++){
                fields[i].type = toggleBox.checked? "text": "password";
            }
            
        }
        //입력창 input태그의 값과 확인창 input태그의 값이 같으면 success-feedback 아니면 fail-feedback
        function feedback(){
            var pw = document.querySelector(".pw");
            var pwCheck = document.querySelector(".pw-check");

            var valid = pw == pwCheck;

            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>비밀번호 확인</h1>
        </div>

        <div class="cell">
            <label>비밀번호<i class="fa-solid fa-asterisk red"></i></label>
            <input type="password" name="memberPassword" class="field w-100 pw">
            <label>
                <input type="checkbox" class="togglebox" oninput="togglePassword();">
                <div class="blue">
                    <i class="fa-solid fa-eye"></i>
                    <span>비밀번호 표시...</span>
                </div>
                <div class="red">
                    <i class="fa-solid fa-eye-slash"></i>
                    <span>비밀번호 미표시...</span>
                </div>
            </label>
            <div class="success-feedback">cool</div>
            <div class="fail-feedback">bad</div>
        </div>
            
        <div class="cell">
            <label>비밀번호 확인<i class="fa-solid fa-asterisk red"></i></label>
            <input type="password" class="field w-100 password-check" oninput="feedback();">
            <div class="success-feedback">비밀번호가 일치합니다</div>
            <div class="fail-feedback">비밀번호가 일치하지 않습니다</div>
        </div>

    </div>
</body>
</html>
