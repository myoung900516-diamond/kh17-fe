<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서등록</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function(){

            var state={
                bookTitleValid : false,
                bookAuthorValid : true,
                bookPublicationDateValid : true,
                bookPriceValid : false,
                bookPublisherValid : true,
                bookPageCountValid : false, 
                bookGenreValid : false, 
                
                ok : function(){
                    return this.bookTitleValid && this.bookAuthorValid && this.bookPublicationDateValid 
                            && this.bookPriceValid && this.bookPublisherValid && this.bookPageCountValid 
                            && this.bookGenreValid; 
                }

            };
            document.querySelector("[name=bookTitle]").addEventListener("blur", function(){
                var valid = this.value.length > 0 && this.value.length <= 300;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");

                state.bookTitleValid = valid;
            });
            document.querySelector("[name=bookAuthor]").addEventListener("blur", function(){
                var regex = /^[^!@#$]+$/;
                var valid = this.value.length == 0 || regex.test(this.value);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");

                state.bookAuthorValid = valid;
            });
            document.querySelector("[name=bookPublicationDate]").addEventListener("blur", function(){
                var regex = /^([0-9]{4})-(((02)-(0[1-9]|1[0-9]|2[0-9]))|((0[469]|11)-(0[1-9]|1[0-9]|2[0-9]|30))|((0[13578]|1[02])-(0[1-9]|1[0-9]|2[0-9]|3[01])))$/;
                var valid = regex.test(this.value);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");

                state.bookPublicationDateValid = valid;
            });
            document.querySelector("[name=bookPrice]").addEventListener("input", function(){
                var originValue = this.value;
                var replaceValue = originValue.replace(/[^0-9]/g, "");
                this.value = parseInt(replaceValue || 0);
            });
            document.querySelector("[name=bookPrice]").addEventListener("blur", function(){
                var price = parseInt(this.value);
                var valid = price >= 0 && price <= 1000000000;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");

                state.bookPriceValid = valid;
            });
            document.querySelector("[name=bookPublisher]").addEventListener("blur", function(){
                this.classList.add("success");

                
            });
            document.querySelector("[name=bookPageCount]").addEventListener("input", function(){
                var originValue = this.value;
                var replaceValue = originValue.replace(/[^0-9]/g, "");
                this.value = parseInt(replaceValue || 0);
            });
            document.querySelector("[name=bookPageCount]").addEventListener("blur", function(){
                var pages = parseInt(this.value);
                var valid = pages > 0;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");

                state.bookPageCountValid = valid;
            });
            document.querySelector("[name=bookGenre]").addEventListener("input", function(){
                var regex = /^(판타지|교양|소설|역사|과학|추리소설|자기계발|수험서)$/;
                var valid = regex.test(this.value);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");

                state.bookGenreValid = valid;
            });

            document.querySelector(".form-check").addEventListener("submit", function(e){
                document.querySelector("[name=bookTitle]").dispatchEvent(new Event("blur"));
                document.querySelector("[name=bookAuthor]").dispatchEvent(new Event("blur"));
                document.querySelector("[name=bookPublicationDate]").dispatchEvent(new Event("blur"));
                document.querySelector("[name=bookPrice]").dispatchEvent(new Event("input"));
                document.querySelector("[name=bookPrice]").dispatchEvent(new Event("blur"));
                document.querySelector("[name=bookPublisher]").dispatchEvent(new Event("blur"));
                document.querySelector("[name=bookPageCount]").dispatchEvent(new Event("input"));
                document.querySelector("[name=bookPageCount]").dispatchEvent(new Event("blur"));
                document.querySelector("[name=bookGenre]").dispatchEvent(new Event("input"));

                if(state.ok() == false){
                    e.preventDefault();
                }
            });
        });




    </script>
</head>
<body>
    <form method="post" enctype="multipart/form-data" 
            autocomplete="off" class="form-check">
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>도서 신규 등록</h1>
        </div>
        <div class="cell">
            <label>도서제목<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="bookTitle" class="field w-100">
            <div class="fail-feedback">필수 항목 입니다</div>
        </div>
        <div class="cell">
            <label>지은이</label>
            <input type="text" name="bookAuthor" class="field w-100">
            <div class="fail-feedback">특수문자는 사용하실 수 없습니다. </div>
        </div>
        <div class="cell">
            <label>출간일</label>
            <input type="date" name="bookPublicationDate" class="field w-100">
            <div class="fail-feedback">유효한 날짜가 아닙니다.</div>
        </div>
        <div class="cell">
            <label>가격<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="bookPrice" class="field w-100">
            <div class="success-feedback">판매가 설정이 완료되었습니다</div>
            <div class="fail-feedback">0원 이상 이어야 합니다.</div>
        </div>
        <div class="cell">
            <label>출판사</label>
            <input type="text" name="bookPublisher" class="field w-100">
        </div>
        <div class="cell">
            <label>페이지수<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="bookPageCount" class="field w-100">
            <div class="success-feedback"></div>
            <div class="fail-feedback">필수 항목입니다.</div>
        </div>
        <div class="cell">
            <label>장르<i class="fa-solid fa-asterisk red"></i></label>
            <select name="bookGenre" class="field w-100">
                <option value="">선택하세요</option>
                <option>판타지</option>
                <option>교양</option>
                <option>소설</option>
                <option>역사</option>
                <option>과학</option>
                <option>추리소설</option>
                <option>자기계발</option>
                <option>수험서</option>
            </select>
            <div class="success-feedback"></div>
            <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>표지</label>
            <input type="file" name="attach" accept=".png, .jpg" 
            multiple class="field w-100">
            <div class="success-feedback"></div>
            <div class="fail-feedback"></div>
        </div>
        <div class="cell right">
            <button type="button" class="btn btn-neutral">
                <i class="fa-solid fa-list"></i>
                목록으로
            </button>
            <button type="submit" class="btn btn-positive">
                <i class="fa-solid fa-plus"></i>등록하기
            </button>
        </div>


               
                
    </div>
    </form>
</body>
</html>
