<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수</title>

    <script>
        //함수(function)
        //-자바의 정적메소드와 유사(static method)
        //-클래스에 포함되어야 하는 자바와 달리 단독으로 존재할 수 있다
        //-용도는 같다(자주 사용하는 코드를 보관시키고 불러서 실행)
        
        console.log("테스트코드");//페이지가 불러지면 무조건 실행, 실행시점조절할 수 없음 
        //어딘가에 보관하겠다. 

        //자바였다면,
        /* public static void test(){
            System.out.println("테스트코드");
        }*/

        //자바스크립트라면,
        //접근제한이 없어요. 그냥 public 
        //static이란 개념이 없어요. 왜냐면 클래스가 없기때문이에요. 
        //반환형 구분을 안해요. 
        function test(){
            console.log("테스트 코드");
        }
        //터미널처럼 콘솔창에 글자를 칠 수 있어요. 

        //자바라면,
        /*public static int multiple(int a, int b){
            return a * b;
        }*/

        //자바스크립트라면,
        function multiple(a, b){
            return a * b;
        }

        //*중요: 자바스크립트 함수는 매개변수가 안맞아도 호출이 가능하다 (=오버로딩 불가)
        //* 자바스크립트의 궁극적인 목표는 "화면"과 "함수"를 연결하는 것이다



    </script>

</head>
<body>
    
</body>
</html>
