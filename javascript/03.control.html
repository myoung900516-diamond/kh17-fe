<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문(control statement)</title>

    <script>
        //데이터 -> 입출력 -> 조건 -> 반복 -> 배열 -> 클래스
        //입출력 -> window.prompt("아무거나 입력해보세요");//이렇게 하지 않음
        //자바스크립트의 제어문(조건, 반복문)
        //-자바와 동일(if, switch, for, while, do-while)

        //(ex)홀짝 구분
        var number =10;
        
        if (number % 2 == 0){
            console.log("짝수");
        }
        else{
            console.log("홀수");
        }

        //(ex) 1부터 10까지 더해서 출력

        var total = 0;
        for(var i=1;i<=10;i ++){
            total += i;
        }
        console.log(total);
    </script>

</head>
<body>
    
</body>
</html>
