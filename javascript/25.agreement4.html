<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용약관 동의</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //전체선택 : .check-All에 input이벤트가 생기면 .check-item에 상태를 전파한다.
        function checkAll(){    
            //전체 선택 체크박스를 가져온다 
            var all = document.querySelector(".check-all");
            
            //console.log(all.checked);//문자열이 나오나? 논리가 나오나? 논리가 나오네...

            //체크항목을 불러와서 상태를 전파한다
            var checkboxes = document.querySelectorAll(".check-item");
            //checkbox.checked=all.checked;
            for(var i=0; i < checkboxes.length; i++){
                checkboxes[i].checked = all.checked;
            }
            //클린업
            checkItem2();

        }
        function checkRequired(){
            var required = document.querySelector(".check-required");

            //체크 여부를 모든 필수 항목 체크박스에 전파
            var checkboxes = document.querySelectorAll(".check-item-required");
            for(var i=0; i < checkboxes.length; i++){
                checkboxes[i].checked = required.checked;
            }
            checkItem2();
        }

        //개별 항목 검사
        //-개별 항목들이 모두 선택되어 있으면 전체 선택을 체크, 아니면 해제
        //-모두 체크되어 있느지 어떻게 알지? 
        //  1. 전체 체크박스를 불러와서 체크된 항목을 카운트한다. 
        //  2. :checked 선택자를 활용 
        
        
        //2.
        function checkItem2(){
            var checkboxes = document.querySelectorAll(".check-item");
            var checkedCheckboxes = document.querySelectorAll(".check-item:checked");
            var allChecked = checkboxes.length == checkedCheckboxes.length;

            var requiredCheckboxes = document.querySelectorAll(".check-item-required");
            var checkedRequiredCheckboxes = 
                        document.querySelectorAll(".check-item-required:checked");

            var requiredChecked = requiredCheckboxes.length == checkedRequiredCheckboxes.length;

            //allChecked에 따라 전체선택 체크박스를 처리
            var all = document.querySelector(".check-all");
            all.checked = allChecked;

            //requiredChecked에 따라 필수 체크박스를 처리
            var required = document.querySelector(".check-required");
            required.checked = requiredChecked;
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>이용약관 동의</h1>
            <p>정상적인 사이트 이용을 위해 다음 이용약관에 동의해주세요</p>
        </div>
        <div class="cell mt-50">
            <!-- label 안에 체크 박스와 글자를 넣으면 id(모듈화를 위해 최악의 선택)없이 글자와 체크박스가 연결된다. -->
            <label> 
                <input type="checkbox" class="check-all" oninput="checkAll();">
                <span>전체 이용약관에 동의합니다.</span>
            </label> 
        </div>
        <div class="cell">
            <!-- label 안에 체크 박스와 글자를 넣으면 id(모듈화를 위해 최악의 선택)없이 글자와 체크박스가 연결된다. -->
            <label> 
                <input type="checkbox" class="check-required" oninput="checkRequired();">
                <span>필수 전체 이용약관에 동의합니다.</span>
            </label> 
        </div>

        <hr>

        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-item-required" oninput="checkItem2();">
                <span>(필수) 개인정보 취급방침에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-item-required" oninput="checkItem2();">
                <span>(필수) 홈페이지 이용규정을 준수하겠습니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item" oninput="checkItem2();">
                <span>(선택) 이벤트성 정보 수신에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item" oninput="checkItem2();">
                <span>(선택) 개인정보 제 3자 제공에 동의합니다</span>
            </label>
        </div>



    </div>
</body>
</html>
