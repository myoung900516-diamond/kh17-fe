<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}

        body{
            width: 2000px;
            height: 5000px;
        }
        .btn-top{
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;

        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //자바스크립트가 제공해주는 내장객체의 종류와 활용
        console.log(window);
        // window.onclick = function(){
        //     console.log("윈도우 클릭");
        // }

        function window01(){
            //window.alert("알림창 테스트"); // window 객체에 있는 alert 함수를 실행
            alert("알림창 테스트");//window는 생략가능
        }
        function window02(){
            var choice = window.confirm("확인창 테스트");
            console.log("choice", choice);
        }
        function window03(){
            var action = window.prompt("아무거나입력");
            console.log("action", action);
        }
        function window04(){
            //innerWidth/height - 창 내부 뷰포트 크기
            //outerWidth/Height - 창 외부 크기
            //scrollX/Y - 스크롤 위치(좌측 혹은 상단의 좌표)
            console.log(window.innerWidth, window.innerHeight, window.scrollX, window.scrollY);
        }
        function moveTop(){
            //window.scrollTo(0,0);//단순한 이동
            // var tag = document.querySelector(".btn-top");
            // tag.value.
            // window.scrollX = 0;//아쉽지만 않됨 읽기 전용 속성
            // window.scrollY = window.innerWidth;

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });
        }
        function window05(){
            window.open("https://www.naver.com");//새탭
        }
        function window06(){
            //window.open("https://www.naver.com", "mywindow");//새탭 + 추적
            //window.open("https://www.naver.com", "myWindow", "width=500, height=500");//child window
            window.open("https://www.naver.com", "_blank", "width=500,height=500");//매번 새로운창 
        }
        function location01(){
            // console.log(window.location);
            // window.location.href = "https://www.google.com";
            location.href = "https://www.google.com";
        }
        function location02(){
            var choice = window.confirm("sure?");
            if(choice == false) return;

            location.href = "https://www.naver.com";
        }
        function history01(){
            //console.log(window.history);
            //history.back();
            history.go(-1); //history.back();과 같은 명령
        }
        function document01(){
            // console.log(window.document);

            //var target = document.getElementById("sample1");//아이디를 가지고 태그 선택
            //var target = document.getElementsByTagName("h2")[0];//태그명을 이용한 태그 선택
            //var target = document.getElementsByClassName("target1")[0];//클래스명을 이용한 태그 선택(여러개)

            //var target = document.querySelector("#sample1");//css 선택자를 이용한 태그 선택
            //var target = document.querySelector("h2");
            var target = document.querySelector(".target1");//클래스명을 이용한 태그 선택
            
            target.style.color = "red";

        }
        function document02(){
            //태그를 여러개 선택하여 배열로 반환하는 명령
            var targets = document.querySelectorAll("h2");
            // targets.style.color = "gold";
            for(var i=0; i < targets.length; i++){
                targets[i].style.color = "gold";
            }
        }

        
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>자바스크립트의 내장객체</h1>
        </div>
        <div class="cell">
            <button type="button" class="btn btn-neutral" onclick="window01();">알림창</button>
            <button type="button" class="btn btn-neutral" onclick="window02();">확인창</button>
            <button type="button" class="btn btn-neutral" onclick="window03();">입력창</button>
            <button type="button" class="btn btn-neutral" onclick="window04();">스크롤</button>
            <button type="button" class="btn btn-neutral" onclick="window05();">새탭</button>
            <button type="button" class="btn btn-neutral" onclick="window06();">새창+추적</button>
            <button type="button" class="btn btn-neutral" onclick="window07();">윈도우정보</button>

            <button type="button" class="btn btn-positive btn-top" onclick="moveTop();">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>

        <div class="cell mt-50">
            <button type="button" class="btn btn-neutral" onclick="location01();">google</button>
            <button type="button" class="btn btn-neutral" onmousemove="location02();">naver</button>
            <!-- 새로고침 :reload 등이 존재 -->
        </div>
        <div class="cell">
            <button type="button" class="btn btn-neutral" onclick="history01();">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <div class="cell mt-50">
            <button type="button" class="btn btn-neutral" onclick="document01();">
                태그선택1
            </button>
            <button type="button" class="btn btn-neutral" onclick="document02();">
                태그선택2
            </button>
        </div>
        <div class="cell">
            <h2 id="sample1" class="target1">Hello Javascript!</h2>            
            <h2 id="sample1" class="target1">Hello Javascript!</h2>            
            <h2 id="sample3" class="target2">Hello Javascript!</h2>            
            <h2 id="sample4" class="target2">Hello Javascript!</h2>            
        </div>

    </div>
</body>
</html>
