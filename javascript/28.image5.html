<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
      window.addEventListener("load", function(){
        //화면 전체에 영향을 주는 데이터 (상태 데이터)
            var size=300;

            var btnSmall = document.querySelector(".btn-small");

            btnSmall.addEventListener("click", function(){
                if(size == 100) return;
                var img = document.querySelector("img");
                size -= 50;
                img.width = size;

                var span = document.querySelector(".current");
                span.textContent = "현재 : " + size + "px";
            });
            
            var btnLarge = document.querySelector(".btn-large")
            btnLarge.addEventListener("click", function(){
                if(size == 500) return;
                var img = document.querySelector("img");
                size += 50;
                img.width = size;
                var span = document.querySelector(".current");
                span.textContent = "현재 : " + size + "px";
            });
        });
    

    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>이미지 크기조절 예제</h1>
        </div>
        <div class="cell center">
            <button type="button" class="btn btn-small">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span class="current">현재 : 300px</span>
            <button type="button" class="btn btn-large ">
                <i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="cell center">
            <img src="https://www.picsum.photos/500" width="300">
        </div>


    </div>
</body>
</html>
