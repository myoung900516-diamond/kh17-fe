<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        function clearText(){
            var display = document.querySelector(".display");
            display.value = "";
        }
        function addText(number){
            var display = document.querySelector(".display");
            display.value += number;
        }
        function oneRemoveText(number){
            var display = document.querySelector(".display");
            var origin = display.value;
            var cut = origin.substring(0, origin.length-1);
            display.value =cut;
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>핸드폰 키패트 문제</h1>
        </div>
        <div class="cell center flex-area">
            <input type="text" class="field display flex-fill " placeholder="전화번호 입력">
        </div>

        <div class="cell flex-area fill-center">
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('7');">7</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('8');">8</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('9');">9</button>
            </div>
        </div>

        <div class="cell flex-area fill-center">
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('4');">4</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('5');">5</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('6');">6</button>
            </div>
        </div>

        <div class="cell flex-area fill-center">
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('1');">1</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('2');">2</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('3');">3</button>
            </div>
        </div>

        <div class="cell flex-area fill-center">
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('*');">*</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('0');">0</button>
            </div>
            <div class="cell flex-fill center">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('#');">#</button>
            </div>
        </div>
        <div class="cell flex-area">
            <button type="button" class="btn flex-fill" onclick="oneRemoveText();">
                    <i class="fa-solid fa-delete-left" style="color: rgb(5, 5, 5);"></i>
            </button>
            <button type="button" class="btn btn-negative flex-fill" onclick="clearText();">clear all</button>
        </div>


    </div>
</body>
</html>
