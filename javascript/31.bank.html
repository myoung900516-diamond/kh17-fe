<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        /* div{ box-shadow: 0 0 0 1px #cccccc;} */
        .outer{
            width: 10%;
            padding: 2px;
        }
        .display{
            font-size:  16px;
            min-height:2.5em;
            word-break: break-all;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function(){
            var numberButtons = document.querySelectorAll(".btn-number");
            for(var i = 0; i < numberButtons.length; i++){
                numberButtons[i].addEventListener("click", function(){
                    var money = parseInt(this.dataset.number);
                    var target = document.querySelector(".target");
                    var current = parseInt(target.value || 0);
                    var result = current + money;
                    target.value = result;
                    // console.log(target.value);
                });
            }
            var deleteButton = document.querySelector(".btn-delete");
            deleteButton.addEventListener("click", function(){
                var target = document.querySelector(".target");
            
                var origin = target.value;
            
                var cut = origin.substring(0, origin.length-1);
                target.value =cut;

                if(target.value.length == 0){
                target.value = "0";
                }
            });
            var clearButton = document.querySelector(".btn-clear");
            clearButton.addEventListener("click", function(){
                var target = document.querySelector(".target");
                target.value = "";

                if(target.value.length == 0){
                target.value = "0";
                }
                
            });
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>계좌이체</h1>
        </div>
        <div class="cell mt-40">
            <input type="text" class="field w-80 target right" placeholder="이체할 금액을 입력하세요" value="0">
        </div>

        <div class="cell flex-area" style="flex-wrap: wrap;">
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="10000000">천만</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="1000000">백만</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="100000">십만</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="10000">만</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="1000">천</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="100">백</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="10">십</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-neutral w-100 btn-number" data-number="1">일</button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-negative w-100 btn-delete">
                    <i class="fa-solid fa-delete-left"></i>
                </button>
            </div>
            <div class="field outer">
                <button type="button" class="btn btn-negative w-100 btn-clear">
                    <i class="fa-solid fa-eraser"></i>
                </button>
            </div>
            
        </div>

    </div>
</body>
</html>
