<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        function checkBookTitle(){
            var tag = document.querySelector("[name=bookTitle]");
            var bytes = getByteLength(tag.value);
            var valid = 0 < bytes && bytes <= 300;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function getByteLength(str){
            return new TextEncoder().encode(str).length;
        }
        function checkBookAuthor(){
            var tag = document.querySelector("[name=bookAuthor]");
            var regex = /^[^!@#$]+$/;
            var valid = tag.value.length == 0 || regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkBookPublisher(){
            var tag = document.querySelector("[name=bookPublisher]");
            tag.classList.add("success");
            return true;
        }
        function checkBookPublicationDate(){
            var tag = document.querySelector("[name=bookPublicationDate]");
            var regex = /^([0-9]{4})-(((02)-(0[1-9]|1[0-9]|2[0-9]))|((0[469]|11)-(0[1-9]|1[0-9]|2[0-9]|30))|((0[13578]|1[02])-(0[1-9]|1[0-9]|2[0-9]|3[01])))$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function filterBookPrice(){
            var tag = document.querySelector("[name=bookPrice]");
            var originValue = tag.value;
            var replaceValue = originValue.replace(/[^0-9]/g, "");
            tag.value = parseInt(replaceValue || 0);
        }
        function checkBookPrice(){
            var tag = document.querySelector("[name=bookPrice]");
            var price = parseInt(tag.value);
            var valid = price >= 0 && price <= 1000000000;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function filterBookPageCount(){
            var tag = document.querySelector("[name=bookPageCount]");
            var originValue = tag.value;
            var replaceValue = originValue.replace(/[^0-9]/g, "");
            tag.value = parseInt(replaceValue || 0);
        }
        function checkBookPageCount(){
            var tag = document.querySelector("[name=bookPageCount]");
            var pages = parseInt(tag.value);
            var valid = pages > 0;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkBookGenre(){
            var tag = document.querySelector("[name=bookGenre]");
            var regex = /^(판타지|교양|소설|역사|과학|추리소설|자기계발|수험서)$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
            return valid;
        }
        function checkAttach(){}
        function checkForm(){
            var bookTitleValid = checkBookTitle();
            var bookAuthorValid = checkBookAuthor();
            var bookPublicationDateValid = checkBookPublicationDate();
            var bookPriceValid = checkBookPrice();
            var bookPageCountValid = checkBookPageCount();
            var bookGenreValid = checkBookGenre();
            var bookPublisherValid = checkBookPublisher();

            var valid = bookTitleValid && bookAuthorValid && bookPublicationDateValid 
                        && bookPriceValid && bookPageCountValid && bookGenreValid && bookPublisherValid;
            
            return valid;
        }


    </script>
</head>
<body>
    <form method="post" enctype="multipart/form-data" 
            autocomplete="off" onsubmit="return checkForm();">
    
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>도서 신규 등록</h1>
        </div>
        <div class="cell">
            <label>도서제목<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="bookTitle" class="field w-100" 
                    onblur="checkBookTitle();">
            <!-- <div class="success-feedback"></div> -->
            <div class="fail-feedback">필수 항목 입니다</div>
        </div>
        <div class="cell">
            <label>지은이</label>
            <input type="text" name="bookAuthor" class="field w-100" 
                    onblur="checkBookAuthor();">
            <div class="fail-feedback">특수문자는 사용하실 수 없습니다. </div>
        </div>
        <div class="cell">
            <label>출간일</label>
            <input type="date" name="bookPublicationDate" class="field w-100" 
                    onblur="checkBookPublicationDate();">
            <div class="fail-feedback">유효한 날짜가 아닙니다.</div>
        </div>
        <div class="cell">
            <label>가격<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="bookPrice" class="field w-100" oninput="filterBookPrice();" 
                    onblur="checkBookPrice();">
            <div class="success-feedback">판매가 설정이 완료되었습니다</div>
            <div class="fail-feedback">0원 이상 이어야 합니다.</div>
        </div>
        <div class="cell">
            <label>출판사</label>
            <input type="text" name="bookPublisher" class="field w-100" onblur="checkBookPublisher();">
        </div>
        <div class="cell">
            <label>페이지수<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="bookPageCount" class="field w-100" oninput="filterBookPageCount();" 
                onblur="checkBookPageCount();">
            <div class="success-feedback"></div>
            <div class="fail-feedback">필수 항목입니다.</div>
        </div>
        <div class="cell">
            <label>장르<i class="fa-solid fa-asterisk red"></i></label>
            <select name="bookGenre" class="field w-100" oninput="checkBookGenre();">
                <option value="">선택하세요</option>
                <option>판타지</option>
                <option>교양</option>
                <option>소설</option>
                <option>역사</option>
                <option>과학</option>
                <option>추리소설</option>
                <option>자기계발</option>
                <option>수험서</option>
            </select>
            <div class="success-feedback"></div>
            <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>표지</label>
            <input type="file" name="attach" accept=".png, .jpg" 
            multiple class="field w-100">
            <div class="success-feedback"></div>
            <div class="fail-feedback"></div>
        </div>
        <div class="cell right">
            <button type="button" class="btn btn-neutral">
                <i class="fa-solid fa-list"></i>
                목록으로
            </button>
            <button type="submit" class="btn btn-positive">
                <i class="fa-solid fa-plus"></i>등록하기
            </button>
        </div>


               
                
    </div>
    </form>
</body>
</html>
