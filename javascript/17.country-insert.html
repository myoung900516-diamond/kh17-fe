<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        function checkCountryName(){
            var tag = document.querySelector("[name=countryName]");
            var regex = /^[가-힣]{1,10}$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        function checkCountryRegion(){
            var tag = document.querySelector("[name=countryRegion]");
            var regex = /^(아시아|아프리카|[남북]아메리카|유럽|오세아니아)$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        function checkCountryCapital(){
            var tag = document.querySelector("[name=countryCapital]");
            var valid = getByteLength(tag.value) <= 36;
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        function getByteLength(str){
            return new TextEncoder.encode(str).length;
        }
        function filterCountryPopulation(){
            var tag = document.querySelector("[name=countryPopulation]");
            var regex = /[^0-9]+/g;
            var replacement = tag.value.replace(regex, "");
            tag.value = replacement;
        }
        function checkCountryPopulation(){
            var tag = document.querySelector("[name=countryPopulation]");
            var valid = parseInt(tag.value || 0) > 0;
            
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        }
    </script>
</head>
<body>
    <form method="post" enctype="multipart/form-data" autocomplete="off">
    <div class="container w-600 mt-50 mb-50">
        
        <div class="container w-400 mt-50">
            <div class="cell center">
                <h1>국가 정보 등록</h1>
            </div>
            <div class="cell">
                <label>대륙명<i class="fa-solid fa-asterisk red"></i></label>
                <select class="field w-100" name="countryRegion" oninput="checkCountryRegion();">
                    <option value="">선택하세요</option>
                    <option>유럽</option>
                    <option>북아메리카</option>
                    <option>남아메리카</option>
                    <option>아프리카</option>
                    <option>아시아</option>
                    <option>오세아니아</option>
                </select>
                <!-- <div class="success-feedback"></div> -->
                <div class="fail-feedback">필수 항목 입니다.</div>
            </div>
            <div class="cell">
                <label>국가명<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="countryName" 
                    class="field w-100" 
                    placeholder="e.g., 대한민국"
                    onblur="checkCountryName();"  spellcheck="false">
                <div class="success-feedback">올바른 형식의 이름입니다</div>
                <div class="fail-feedback">한글 10글자 이내로 작성하세요.</div>
            </div>
            <div class="cell">
                <label>수도명<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="countryCapital" 
                    class="field w-100" 
                    placeholder="e.g., 서울"
                    onblur="checkCountryCapital();"  spellcheck="false">
                <div class="success-feedback"></div>
                <div class="fail-feedback">미입력이거나 허용 크기를 초과했습니다.</div>
            </div>
            <div class="cell">
                <label>인구수<i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" 
                    name="countryPopulation" 
                    class="field w-100" 
                    placeholder="e.g., 55000000" 
                    oninput="filterCountryPopulation();" 
                    onblur="checkCountryPopulation();"  spellcheck="false">
                <div class="success-feedback"></div>
                <div class="fail-feedback"></div>
            </div>  
            <div class="cell">
                <label>국기</label>
                <input type="file" name="attach" class="field w-100">
            </div>           
            <div class="cell mt-40 right">
                <button class="btn btn-neutral">
                    목록으로
                </button>
                <button class="btn btn-positive">
                    등록하기
                </button>
            </div>            
        </div>

    </form>


    </div>
</body>
</html>
