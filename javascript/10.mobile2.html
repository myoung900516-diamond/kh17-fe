<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        /* div{ box-shadow: 0 0 0 1px #cccccc;} */
        .display{
            font-size:  24px;
            padding: 0.5em;
            min-height:2.5em;
            word-break: break-all;
        }
        .outer{
            width: 33.3333%;
            padding: 5px;
        }
    </style>
    <!-- 자바스크립트 작성 영역 -->
    <script>
        function clearText(){
            var display = document.querySelector(".display");
            display.textContent = "";
        }
        function addText(number){
            var display = document.querySelector(".display");
            display.textContent += number;
        }
        function oneRemoveText(number){
            var display = document.querySelector(".display");
            var origin = display.textContent;
            var cut = origin.substring(0, origin.length-1);
            display.textContent =cut;
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>핸드폰 키패트 문제</h1>
        </div>
        <div class="cell center flex-area">
            <div class="display"></div>
        </div>

        <div class="cell flex-area" style="flex-wrap: wrap;">
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('7');">
                    <i class="fa-solid fa-7"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('8');">
                    <i class="fa-solid fa-8"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('9');">
                    <i class="fa-solid fa-9"></i>
                </button>
            </div>
        </div>

        <div class="cell flex-area" style="flex-wrap: wrap;">
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('4');">
                    <i class="fa-solid fa-4"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('5');">
                    <i class="fa-solid fa-5"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('6');">
                    <i class="fa-solid fa-6"></i>
                </button>
            </div>
        </div>

        <div class="cell flex-area" style="flex-wrap: wrap;">
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('1');">
                    <i class="fa-solid fa-1"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('2');">
                    <i class="fa-solid fa-2"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('3');">
                    <i class="fa-solid fa-3"></i>
                </button>
            </div>
        </div>

        <div class="cell flex-area" style="flex-wrap: wrap;">
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('*');">
                    <i class="fa-solid fa-asterisk"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('0');">
                    <i class="fa-solid fa-0"></i>
                </button>
            </div>
            <div class="outer">
                <button type="button" class="btn btn-neutral w-100" onclick="addText('#');">
                    <i class="fa-solid fa-hashtag"></i>
                </button>
            </div>
        </div>
        <div class="cell flex-area">
            <button type="button" class="btn w-100" onclick="oneRemoveText();">
                    <i class="fa-solid fa-delete-left" style="color: rgb(5, 5, 5);"></i>
            </button>
            <button type="button" class="btn btn-negative w-100" onclick="clearText();">clear all</button>
        </div>


    </div>
</body>
</html>
