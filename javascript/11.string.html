<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //문자열
        //- 자바에서 가능했던 문자열 처리의 대부분이 존재(나중에 추가된것들도 있음)

        var a = "hello";
        var b = "hello";
        var c = "Hello";

        //(Q) a와 b는 같습니까? 자바에서는 equals() 혹은 equalsIgnoreCase() 사용
        console.log(a == b);//자바스크립트는 비교연산으로 비교가능

        //(Q) a와 c가 같습니까? 대소문자 무시하고... 
        console.log(a.toLowerCase() == c.toLowerCase());

        //(Q) d에 naver가 있습니까? ->자바에서 contains() 또는 indexOf()
        //(Q) d는 https로 시작합니까? ->자바에서 startsWith()
        //(Q) d는 회사의 주소입니까? -> endsWith()
        //(Q) d에 몇 글자 입니까? -> length()
        var d = "https://www.naver.com";
        //console.log(d.contains("naver")); //자바스크립트에는 없음 
        console.log(d.includes("naver"));
        console.log(d.indexOf("naver"));
        console.log(d.startsWith("https://"));
        console.log(d.endsWith(".com"));

        console.log(d.substring(12, 17));
        console.log(d.length);

        //불변이라는 점도 같고, 대부분의 메소드도 비슷(다른것도 존재)

        //d에서 naver를 google로 변경해서 출력
        console.log(d.replace("naver", "google"));

        //정규표현식 검사도 가능한가? 
        var id = "hello1234";
        var regex =/^[a-z][a-z0-9]{4,19}$/;
        console.log(regex.test(id));

        //문자열과 숫자간의 변환이 가능한가? 
        //자바에서는,
        //String n1= "100";
        //int n2 = Integer.parseInt(n1);
        //System.out.println(n2);

        //자바스크립트는 -정수는 int, 실수는 float입니다
        //정수로 변환할 때는 parseInt(), 실수로 변환할 때는 parseFloat()사용
        var n1 = "100";
        var n2 = parseInt(n1);
        console.log(n1, n2);



    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>제목</h1>
        </div>


    </div>
</body>
</html>
