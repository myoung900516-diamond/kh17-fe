<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>standalone</title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        // 기존의 방식 : 함수를 만들고 태그를 제어하게 만든 뒤 onclick과 같은 속성으로 호출
        //inline javascript는 종속적인 코드. 독립적인 코드라고 볼 수 없음. 모듈화가 안 됨 
        function changeColor(){
            var target = document.querySelector(".target");
            target.style.color = "red";
        }

        //버튼을 한번 선택해볼게요(현재 코드 작성 순서 때문에 재대로 선택이 안됨 )
        var btn = document.querySelector(".btn");
        btn.onclick = changeColor; //<button onclick="changeColor()";>와 같은 코드 (콜백 함수 설정 '예약')
        //btn.onclick = function(){changeColor();};
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>독립형 자바스크립트</h1>
        </div>
        <div class="cell">
            <button type="button" class="btn btn-positive w-100">색상변경</button>
        </div>
        <div class="cell">
            <h2 class="target">Hello Javascript!</h2>
        </div>

    </div>
</body>
</html>
