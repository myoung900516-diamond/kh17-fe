<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keypad
    </title>
    <link rel="icon" href="/kh.png" type="image/jpeg">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        type="text/css">
    <link rel="stylesheet" href="../css/commons.css" type="text/css">
    <style>
        div{ box-shadow: 0 0 0 1px #cccccc;}
        .display-group {
            font-size: 36px;
            font-weight: bold;
            display: flex;
            height: 2.5em;
        }
        .display-group > .display{
            width: 16.6666%;
            padding: 0.5em;
            text-align: center;
        }
        .button-group{
            display: flex;
            flex-wrap: wrap;
            /* 줄바꿈 허용 */
        }
        .button-group > .inner {
            width: 25%;
            padding: 5px;
        }
        .button-group button{
            width: 100%;
            height: 2.5em;
        }

    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //1차 목표
        window.addEventListener("load", function(){
            var password = "";
            display();
            
            
            function display(){
                var displayList = document.querySelectorAll(".display");
                for(var i =0; i < displayList.length; i++){
                    displayList[i].textContent = password[i];
                }
            }
            //3차 목표 : 숫자가 없는 버튼을 추가하고 디자인 적용
            var numberButtons = document.querySelectorAll(".btn-number");

            for(var i =0; i < numberButtons.length; i++){
                numberButtons[i].addEventListener("click", function(){
                    if(password.length >= 6) return;

                    //this == 클릭한 버튼
                    password += this.textContent;//비밀번호에 현재 클린한 버튼의 글자를 더해라 
                    display();
                });
            }
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>비밀번호입력</h1>
        </div>
        <!-- 설정된 비밀번호를 표시할 영역 -->
        <div class="cell">
            <div class="display-group">
                <div class="display"></div>
                <div class="display"></div>
                <div class="display"></div>
                <div class="display"></div>
                <div class="display"></div>
                <div class="display"></div>
            </div>
        </div>

        <!-- 버튼영역 -->
        <div class="cell">
            <div class="button-group">
                <div class="inner"><button type="button" class="btn btn-positive btn-number">1</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">2</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">3</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">4</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">5</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">6</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">7</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">8</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">9</button></div>
                <div class="inner"><button type="button" class="btn btn-positive btn-number">0</button></div>
                <div class="inner"><button type="button" class="btn btn-neutral btn-number"></button></div>               
                <div class="inner"><button type="button" class="btn btn-neutral btn-number"></button></div>               
                <div class="inner"><button type="button" class="btn btn-neutral btn-number"></button></div>               
                <div class="inner"><button type="button" class="btn btn-neutral btn-number"></button></div>               
                <div class="inner"><button type="button" class="btn btn-neutral btn-number"></button></div>               
                <div class="inner"><button type="button" class="btn btn-neutral btn-number"></button></div>           
        </div>
            </div>


    </div>
</body>
</html>
