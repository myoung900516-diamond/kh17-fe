<script type="text/javascript">
    //구조 분해 할당 (Destructuring Assignment)
    //-배열이나 객체를 쉽게 해체하기 위한 기법
    //-배열과 객체 중심으로 구문을 작성

    const a = [10, 20, 30, 40, 50];

    //a에서 2개만 뽑아서 a1, a2라고 저장하려면?
    // const a1 = a[0];
    // const a2 = a[1];

    const[r, f, w] = a;
    console.log(r, f, w);

    //응용하면 이런것도 가능
    let b = 10, c = 20;
    [b, c] = [c, b];//swap코드

    const d = {
        no : 1,
        name : "대한민국", 
        capital : "서울", 
        region : "아시아", 
        population : 550000000
        
    };

    //(Q) d의 이름과 수도만 꺼내서 name, capital이란 변수에 저장해보세요. 
    const{name, capital} = d;

    console.log(name, capital);

    //(Q) d에서 수도를 부산으로 
    const e = {
        ...d,
        capital : "부산"
    };
    console.log(e);

</script>
